<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#1D1038">
<title>لا يوجد اتصال بالإنترنت — منصة الدكتور محمد عبد الله</title>
<style>
  :root{
    --bg:#FAF8FD; --card:#ffffff; --text:#1E1037; --muted:#6C6081;
    --primary:#753FD2; --primary-dark:#4F2598; --cyan:#923FBC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal','Segoe UI',Arial,sans-serif;
    background:radial-gradient(90% 60% at 50% 0%, rgba(117,63,210,.10), rgba(117,63,210,0) 60%), var(--bg);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .card{
    background:var(--card); border-radius:22px; padding:38px 28px 34px;
    max-width:380px; width:100%; text-align:center;
    border:1px solid rgba(117,63,210,.10);
    box-shadow:0 14px 44px rgba(30,16,55,0.10);
  }
  .icon{
    width:76px; height:76px; margin:0 auto 16px; border-radius:20px;
    background:linear-gradient(150deg,#311A58,#160C28);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(30,16,55,.28);
  }
  .icon svg{width:58px;height:58px;display:block;}
  .brand{font-weight:900; font-size:1.05rem; color:var(--text); line-height:1.4;}
  .brand small{display:block; font-weight:700; font-size:.78rem; letter-spacing:.02em; color:var(--cyan); margin-top:2px;}
  .rule{width:44px;height:3px;border-radius:3px;margin:16px auto 18px;background:linear-gradient(90deg,var(--primary),var(--cyan));}
  h1{font-size:1.12rem; font-weight:800; margin-bottom:10px;}
  p{color:var(--muted); font-size:0.92rem; line-height:1.8; margin-bottom:22px;}
  button{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff; border:none; border-radius:12px; padding:12px 28px;
    font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer;
    box-shadow:0 8px 20px rgba(117,63,210,0.32);
  }
  button:active{transform:scale(0.97);}
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><defs>
<linearGradient id="ofm" x1="10" y1="34" x2="38" y2="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8C4FF"/></linearGradient>
<linearGradient id="ofo" x1="3" y1="34" x2="45" y2="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9A8FF"/><stop offset="1" stop-color="#8C62DB"/></linearGradient>
</defs>
<circle cx="24" cy="24" r="21.4" stroke="url(#ofo)" stroke-width="1.7" fill="none" opacity="1.0"/>
<path d="M10 34 C10 24 12 14 17 14 C20.5 14 21 30 24 30 C27 30 27.5 14 31 14 C36 14 38 24 38 34" stroke="url(#ofm)" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="39.9" cy="9.68" r="4.9" fill="#D9B6F5" opacity=".22"/>
<circle cx="39.9" cy="9.68" r="2.7" fill="#F0DBFF"/></svg></div>
    <div class="brand">منصة الدكتور محمد عبد الله<small>عميد الفيزياء</small></div>
    <div class="rule"></div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت حاليًا. تحقق من الاتصال وحاول مرة أخرى للوصول إلى المنصة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
