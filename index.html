  <style>
    :root {
      --ld-bg: #FAF8FD;  --ld-bg2: #F2EDFB;  --ld-ink: #1E1037;  --ld-muted: #6C6081;
      --ld-blue: #753FD2; --ld-blue2: #622EBC; --ld-cyan: #9C4EC4; --ld-violet: #A988E3;
      --ld-silver: #D3CAE2; --ld-ring: rgba(117, 63, 210, 0.10); --ld-chip: rgba(255, 255, 255, 0.72);
    }
    :root[data-theme="dark"] {
      --ld-bg: #110A1D;  --ld-bg2: #201138;  --ld-ink: #F3EEFB;  --ld-muted: #A799C0;
      --ld-blue: #9A72DE; --ld-blue2: #8556D7; --ld-cyan: #B070CF; --ld-violet: #C2AAEB;
      --ld-silver: #4F3B72; --ld-ring: rgba(176, 146, 229, 0.11); --ld-chip: rgba(34, 20, 59, 0.72);
    }

    #iraqi-loader {
      position: fixed; inset: 0; z-index: 99999; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(70% 55% at 50% 40%, var(--ld-bg2) 0%, var(--ld-bg) 72%);
      color: var(--ld-ink);
      font-family: 'Tajawal', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      direction: ltr;
      transition: opacity .6s ease, visibility .6s ease, transform .6s ease;
    }
    #iraqi-loader.ld-hide { opacity: 0; visibility: hidden; transform: scale(1.02); pointer-events: none; }

    /* faint concentric "wave fronts" behind the atom */
    #iraqi-loader::before {
      content: ''; position: absolute; inset: -10%;
      background: repeating-radial-gradient(circle at 50% 41%, transparent 0 70px, var(--ld-ring) 71px 72px);
      -webkit-mask-image: radial-gradient(circle at 50% 41%, #000 0, transparent 62%);
              mask-image: radial-gradient(circle at 50% 41%, #000 0, transparent 62%);
      animation: ldDrift 9s linear infinite;
    }
    @keyframes ldDrift { from { transform: scale(1); } to { transform: scale(1.06); } }

    #ld-stage {
      position: relative; z-index: 1; width: min(92vw, 440px);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 24px 16px;
    }

    /* ── Atom ─────────────────────────────────────────── */
    #ld-atom {
      position: relative; width: clamp(150px, 44vw, 208px); aspect-ratio: 1 / 1;
      animation: ldIn .7s cubic-bezier(.2, .7, .2, 1) both;
    }
    #ld-atom svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .ld-orbit { fill: none; stroke: url(#ldOrb); stroke-width: 1.5; opacity: .95; }
    .ld-orbit.o1 { stroke: #9C4EC4; } .ld-orbit.o2 { stroke: #753FD2; } .ld-orbit.o3 { stroke: #976FDD; }
    .ld-nucleus-glow { fill: var(--ld-blue); opacity: .18; transform-origin: 120px 120px; animation: ldPulse 2.4s ease-in-out infinite; }
    .ld-ripple {
      position: absolute; inset: 14%; border-radius: 50%;
      border: 1px solid var(--ld-blue); opacity: 0;
      animation: ldRipple 3.2s cubic-bezier(.2, .6, .3, 1) infinite;
    }
    .ld-ripple.r2 { animation-delay: 1.6s; border-color: #976FDD; }
    @keyframes ldRipple { 0% { transform: scale(.55); opacity: .0; } 18% { opacity: .32; } 100% { transform: scale(1.55); opacity: 0; } }
    @keyframes ldPulse  { 0%, 100% { transform: scale(1); opacity: .16; } 50% { transform: scale(1.5); opacity: .30; } }
    @keyframes ldIn     { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
    @keyframes ldUp     { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* equation chip that appears step by step */
    #ld-eq {
      position: absolute; top: 4%; right: -10%;
      padding: 5px 12px; border-radius: 999px;
      font-family: 'Cambria Math', 'STIX Two Text', Georgia, 'Times New Roman', serif; font-style: italic;
      font-size: clamp(.82rem, 3vw, .98rem); color: var(--eq-c, var(--ld-blue2)); letter-spacing: .01em;
      background: var(--ld-chip); border: 1px solid var(--eq-b, rgba(117, 63, 210, .30));
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      opacity: 0; transform: translateY(5px); transition: opacity .35s ease, transform .35s ease;
      white-space: nowrap;
    }
    #ld-eq.ld-eq-in { opacity: 1; transform: none; }

    /* ── Brand ────────────────────────────────────────── */
    #ld-name {
      margin: clamp(10px, 2.4vh, 20px) 0 0; max-width: 100%;
      font-size: clamp(1.32rem, 5.6vw, 2rem); font-weight: 900; line-height: 1.3; color: var(--ld-ink);
      text-wrap: balance; animation: ldUp .6s .18s cubic-bezier(.2, .7, .2, 1) both;
    }
    #ld-tagline {
      display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px;
      font-size: clamp(1rem, 3.8vw, 1.22rem); font-weight: 800; color: var(--ld-blue); letter-spacing: .02em;
      animation: ldUp .6s .32s cubic-bezier(.2, .7, .2, 1) both;
    }
    #ld-tagline::before, #ld-tagline::after {
      content: ''; width: clamp(26px, 9vw, 46px); height: 1.5px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--ld-cyan));
    }
    #ld-tagline::after { background: linear-gradient(270deg, transparent, var(--ld-cyan)); }

    /* ── Wave progress ────────────────────────────────── */
    #ld-progress { margin-top: clamp(16px, 3.4vh, 26px); display: flex; flex-direction: column; align-items: center; animation: ldUp .6s .46s cubic-bezier(.2, .7, .2, 1) both; }
    #ld-wave { position: relative; width: 240px; height: 28px; direction: ltr; }
    #ld-wave svg { display: block; width: 240px; height: 28px; overflow: hidden; }
    #ld-wave .ld-track { fill: none; stroke: var(--ld-silver); stroke-width: 2; stroke-linecap: round; opacity: .85; }
    #ld-wave .ld-live  { fill: none; stroke: url(#ldWaveG); stroke-width: 2.6; stroke-linecap: round; }
    .ld-wave-move { animation: ldWave 1.3s linear infinite; }
    @keyframes ldWave { to { transform: translateX(-40px); } }
    #ld-bar-fill {
      position: absolute; left: 0; top: 0; height: 100%; width: 0; overflow: hidden;
      transition: width .5s cubic-bezier(.4, 0, .2, 1);
      filter: drop-shadow(0 0 5px rgba(117, 63, 210, .45));
    }
    #ld-msg {
      margin: 10px 0 0; min-height: 1.5em; font-size: clamp(.86rem, 3.2vw, .98rem); font-weight: 500; color: var(--ld-muted);
      opacity: 0; transition: opacity .3s ease;
    }
    #ld-msg.ld-msg-in { opacity: 1; }

    @media (max-height: 520px) {
      #ld-atom { width: clamp(96px, 30vh, 150px); }
      #ld-name { margin-top: 6px; }
      #ld-progress { margin-top: 10px; }
      #ld-stage { padding: 10px 16px; }
    }
    @media (max-width: 340px) { #ld-wave, #ld-wave svg { width: 210px; } }
    @media (prefers-reduced-motion: reduce) {
      #iraqi-loader *, #iraqi-loader::before { animation: none !important; }
      #iraqi-loader { transition-duration: .01s; }
      #ld-name, #ld-tagline, #ld-progress, #ld-atom { opacity: 1; }
    }
  </style>
</head>

      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 14px;
      direction: ltr;
    }

    [data-theme=dark] #dashPhoneInput, [data-theme=dark] #dashPwInput {
      background: #292138;
      color: #e8e4ee;
      border-color: #403751;
    }

    #dashPhoneInput:focus, #dashPwInput:focus {
      border-color: #672FC7;
      box-shadow: 0 0 0 3px rgba(87, 46, 159, .15);
    }

    #dashPwErr {
      background: #fff0f3;
      color: #c0392b;
      border: 1px solid #ffd0d8;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      display: none;
    }

    #dashPwSubmit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a1227, #672FC7);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(87, 46, 159, .3);
      margin-bottom: 10px;
    }

    #dashPwSubmit:hover {
      transform: translateY(-2px);
    }

    #dashPwCancel {
      width: 100%;
      padding: 11px;
      background: #f4f2f8;
      color: #544B65;
      border: none;
      border-radius: 12px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    [data-theme=dark] #dashPwCancel {
      background: #292138;
      color: #a298b4;
    }

    @keyframes pwShake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-8px)
      }

      40% {
        transform: translateX(8px)
      }

      60% {
        transform: translateX(-5px)
      }

      80% {
        transform: translateX(5px)
      }
    }

    .pw-shake {
      animation: pwShake .45s ease;
    }
  </style>

  <div id="dashPwOverlay" onclick="if(event.target===this)closeDashModal()">
    <div id="dashPwModal">
      <div class="pw-icon">🔐</div>
      <h3>Platform Control Panel</h3>
      <p>Sign in with your administrator account to open the control panel</p>
      <input type="tel" id="dashPhoneInput" placeholder="01xxxxxxxxx" maxlength="11" inputmode="numeric" autocomplete="username" dir="ltr"
        onkeydown="if(event.key==='Enter')document.getElementById('dashPwInput').focus()">
      <input type="password" id="dashPwInput" placeholder="••••••" maxlength="64" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')verifyDashPw()">
      <div id="dashPwErr">❌ Incorrect phone number or password.</div>
      <button id="dashPwSubmit" onclick="verifyDashPw()">Enter Dashboard →</button>
      <button id="dashPwCancel" onclick="closeDashModal()">Cancel</button>
    </div>
  </div>

  <!-- ═══════════════ منطق شاشة التحميل ═══════════════ -->
  <script>
    (function () {
      var loader = document.getElementById('iraqi-loader');
      if (!loader) return;
      var bar = document.getElementById('ld-bar-fill');
      var msg = document.getElementById('ld-msg');
      var eq  = document.getElementById('ld-eq');
      var atom = document.querySelector('#ld-atom svg');

      // Respect reduced motion: freeze the SMIL electrons (CSS animations are handled in the stylesheet)
      try {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && atom && atom.pauseAnimations) {
          atom.pauseAnimations();
        }
      } catch (e) {}

      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var steps = [
        { m: 'نجهّز معمل الفيزياء…', e: 'F = ma',     p: 24, c: dark ? '#C5AEF2' : '#6A3FBD', b: 'rgba(127,86,208,.40)' },
        { m: 'نضبط القياسات…',        e: 'V = IR',     p: 48, c: dark ? '#B4B0F7' : '#5B4BC4', b: 'rgba(111,106,232,.42)' },
        { m: 'نرتّب القوانين…',       e: 'E = mc²',    p: 74, c: dark ? '#D9B6F5' : '#8B4EC2', b: 'rgba(176,113,232,.44)' },
        { m: 'كل شيء جاهز.',           e: 'λ = v / f',  p: 96, c: dark ? '#DDA6EE' : '#7A3B9E', b: 'rgba(166,83,196,.44)' }
      ];

      function show(i, animate) {
        var s = steps[i];
        if (!s) return;
        if (bar) bar.style.width = s.p + '%';
        function apply() {
          if (msg) { msg.textContent = s.m; msg.classList.add('ld-msg-in'); }
          if (eq)  { eq.textContent = s.e; eq.style.setProperty('--eq-c', s.c); eq.style.setProperty('--eq-b', s.b); eq.classList.add('ld-eq-in'); }
        }
        if (!animate) { apply(); return; }
        if (msg) msg.classList.remove('ld-msg-in');
        if (eq)  eq.classList.remove('ld-eq-in');
        setTimeout(apply, 170);
      }

      show(0, false);
      setTimeout(function () { show(1, true); }, 560);
      setTimeout(function () { show(2, true); }, 1120);
      setTimeout(function () { show(3, true); }, 1660);

      function hide() {
        if (!loader || !loader.parentNode) return;
        if (bar) bar.style.width = '100%';
        setTimeout(function () {
          loader.classList.add('ld-hide');
          if (typeof window.startHeroTypewriter === 'function') {
            setTimeout(window.startHeroTypewriter, 250);
          }
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 800);
        }, 220);
      }

      // Short, non-annoying: visible for ~2 s minimum, then leaves as soon as the page has loaded
      var shownAt = Date.now();
      var MIN_MS = 2100;
      function tryHide() {
        setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - shownAt)));
      }
      if (document.readyState === 'complete') { tryHide(); }
      else { window.addEventListener('load', tryHide); }

      // Safety net: never trap the user behind the loader
      setTimeout(function () { if (loader && loader.parentNode) hide(); }, 9000);
    })();
  </script>

  <script>
    (function () {
      var FILE = 'dashboard.html';

      // لا توجد كلمة مرور في الكود: الأدمن يسجّل بحسابه (هاتف + كلمة مرور) ويُتحقق منه من Firebase Auth + مستند admins/{uid}
      window.openDashModal = async function () {
        try {
          if (window.AuthService) {
            await AuthService.ready();
            if (AuthService.isAdmin() && await AuthService.requireAdmin()) { window.location.href = FILE; return; }
          }
        } catch (e) {}
        var ov = document.getElementById('dashPwOverlay'), inp = document.getElementById('dashPwInput'), ph = document.getElementById('dashPhoneInput'), err = document.getElementById('dashPwErr');
        if (!ov) return; ov.classList.add('open');
        if (err) err.style.display = 'none';
        if (inp) inp.value = '';
        if (ph) { ph.value = ''; setTimeout(function () { ph.focus(); }, 120); }
      };
      window.closeDashModal = function () { var ov = document.getElementById('dashPwOverlay'); if (ov) ov.classList.remove('open'); };
      window.verifyDashPw = async function () {
        var inp = document.getElementById('dashPwInput'), ph = document.getElementById('dashPhoneInput'), err = document.getElementById('dashPwErr'), modal = document.getElementById('dashPwModal'), btn = document.getElementById('dashPwSubmit');
        var pw = inp ? inp.value : '', phone = ph ? ph.value : '';
        function fail(msg) {
          if (err) { err.textContent = '❌ ' + msg; err.style.display = 'block'; }
          if (modal) { modal.classList.remove('pw-shake'); void modal.offsetWidth; modal.classList.add('pw-shake'); }
          if (inp) { inp.value = ''; inp.focus(); }
        }
        if (!window.AuthService) return fail('Authentication service is unavailable.');
        if (btn) btn.disabled = true;
        var r;
        try { r = await AuthService.adminLogin(phone, pw); } finally { if (btn) btn.disabled = false; }
        if (r && r.ok) {
          if (err) err.style.display = 'none';
          closeDashModal();
          window.location.href = FILE;      // الانتقال المباشر (يتجنب Popup Blocker على الهواتف)
        } else {
          fail((r && r.message) || 'Incorrect phone number or password.');
        }
      };
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDashModal(); });
    })();
  </script>
