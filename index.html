  <!-- ═══════════════════════════════════════════════════════════
         شاشة التحميل — الخلية | أ/ إسلام عبدالواحد

         ═══════════════════════════════════════════════════════════ -->
  <style>
    #iraqi-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #EDFBFD 0%, #F7FCFD 45%, #EAF7FA 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #iraqi-loader.ld-hide { opacity: 0; visibility: hidden; pointer-events: none; }

    [data-theme="dark"] #iraqi-loader {
      background: radial-gradient(circle at 50% 38%, #0B2130 0%, #061019 55%, #030A11 100%);
    }

    /* Floating microscopic particles */
    .ld-particles { position: absolute; inset: 0; pointer-events: none; }
    .ld-p {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.30) 0%, rgba(6,182,212,0) 70%);
      filter: blur(1px);
      animation: ldFloat 7s ease-in-out infinite;
    }
    [data-theme="dark"] .ld-p { background: radial-gradient(circle, rgba(34,211,238,0.35) 0%, rgba(34,211,238,0) 70%); }
    .ld-p1 { width: 90px;  height: 90px;  left: 12%; top: 22%; animation-delay: 0s; }
    .ld-p2 { width: 50px;  height: 50px;  right: 15%; top: 18%; animation-delay: 1.1s; background: radial-gradient(circle, rgba(16,185,129,0.28) 0%, rgba(16,185,129,0) 70%); }
    .ld-p3 { width: 70px;  height: 70px;  right: 10%; bottom: 24%; animation-delay: 2.1s; }
    .ld-p4 { width: 40px;  height: 40px;  left: 16%; bottom: 20%; animation-delay: 3.2s; background: radial-gradient(circle, rgba(16,185,129,0.28) 0%, rgba(16,185,129,0) 70%); }
    .ld-p5 { width: 26px;  height: 26px;  left: 46%; top: 10%; animation-delay: 0.6s; }
    .ld-p6 { width: 30px;  height: 30px;  right: 40%; bottom: 12%; animation-delay: 1.8s; background: radial-gradient(circle, rgba(16,185,129,0.24) 0%, rgba(16,185,129,0) 70%); }

    @keyframes ldFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
      50%      { transform: translateY(-22px) scale(1.08); opacity: 1; }
    }

    /* Core animation: cell membrane rings + orbiting molecules + DNA mark */
    .ld-core {
      position: relative;
      width: 148px;
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ld-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(6, 182, 212, 0.35);
    }
    .ld-ring-outer { animation: ldRingPulse 2.6s ease-in-out infinite; }
    .ld-ring-inner { inset: 16px; border-color: rgba(16, 185, 129, 0.4); animation: ldRingPulse 2.6s ease-in-out infinite 0.5s; }
    [data-theme="dark"] .ld-ring-outer { border-color: rgba(34, 211, 238, 0.4); }
    [data-theme="dark"] .ld-ring-inner { border-color: rgba(52, 211, 153, 0.45); }

    @keyframes ldRingPulse {
      0%, 100% { transform: scale(0.94); opacity: 0.55; }
      50%      { transform: scale(1.04); opacity: 1; }
    }

    .ld-orbit {
      position: absolute;
      inset: -6px;
      animation: ldSpin 6s linear infinite;
    }
    .ld-dot {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px currentColor;
    }
    .ld-dot-a { top: 2px; left: 50%; margin-left: -4px; color: #06B6D4; background: #06B6D4; }
    .ld-dot-b { bottom: 14px; right: 6px; color: #10B981; background: #10B981; }
    .ld-dot-c { bottom: 14px; left: 6px; color: #22D3EE; background: #22D3EE; }

    @keyframes ldSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .ld-dna {
      position: relative;
      width: 58px;
      height: 58px;
      animation: ldPulse 2.2s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.45));
    }
    @keyframes ldPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    /* Brand */
    .ld-brand { text-align: center; }
    .ld-brand-name {
      margin: 0;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 0.01em;
      background: linear-gradient(135deg, #0E7490 0%, #06B6D4 45%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: ldFadeUp 0.7s ease both;
    }
    .ld-brand-sub {
      margin: 6px 0 0;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #3D6478;
      animation: ldFadeUp 0.7s ease 0.15s both;
    }
    [data-theme="dark"] .ld-brand-sub { color: #7FA9B8; }

    @keyframes ldFadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Progress */
    .ld-progress { width: 220px; text-align: center; }
    .ld-bar-track {
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: rgba(6, 182, 212, 0.14);
      overflow: hidden;
    }
    [data-theme="dark"] .ld-bar-track { background: rgba(34, 211, 238, 0.16); }
    #ld-bar-fill {
      height: 100%;
      width: 6%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0E7490, #06B6D4, #10B981);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
    }
    #ld-msg {
      margin: 12px 0 0;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6B8A9A;
      min-height: 1.2em;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #ld-msg.ld-msg-in { opacity: 1; transform: translateY(0); }
    [data-theme="dark"] #ld-msg { color: #7FA9B8; }

    @media (max-width: 420px) {
      .ld-core { width: 120px; height: 120px; }
      .ld-dna { width: 46px; height: 46px; }
      .ld-brand-name { font-size: 1.7rem; }
      .ld-progress { width: 180px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ld-p, .ld-ring, .ld-orbit, .ld-dna, .ld-brand-name, .ld-brand-sub { animation: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var loader = document.getElementById('iraqi-loader');
      var bar = document.getElementById('ld-bar-fill');
      var msg = document.getElementById('ld-msg');
      if (!loader) return;

      var msgs = [
        'نجهّز عالم الأحياء…',
        'نستكشف الخلية…',
        'نرتّب المفاهيم…',
        'نجهّز الدروس…',
        'كل شيء جاهز.'
      ];
      var pcts = [15, 32, 54, 76, 95];
      var i = 0;

      function step(crossfade) {
        if (i >= msgs.length) return;
        if (bar) bar.style.width = pcts[i] + '%';
        if (msg) {
          if (crossfade) {
            msg.classList.remove('ld-msg-in');
            (function (text) {
              setTimeout(function () {
                msg.textContent = text;
                msg.classList.add('ld-msg-in');
              }, 200);
            })(msgs[i]);
          } else {
            msg.textContent = msgs[i];
          }
        }
        i++;
      }

      step(false);
      setTimeout(function () { if (msg) msg.classList.add('ld-msg-in'); }, 700);
      var t1 = setTimeout(function () { step(true); }, 900);
      var t2 = setTimeout(function () { step(true); }, 2300);
      var t3 = setTimeout(function () { step(true); }, 3800);
      var t4 = setTimeout(function () { step(true); }, 5100);

      function hide() {
        if (!loader || !loader.parentNode) return;
        if (bar) bar.style.width = '100%';
        setTimeout(function () {
          loader.classList.add('ld-hide');
          if (typeof window.startHeroTypewriter === 'function') {
            setTimeout(window.startHeroTypewriter, 300);
          }
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 900);
        }, 300);
      }

      var minAt = Date.now() + 6300;
      function tryHide() {
        var delay = Math.max(0, minAt - Date.now());
        setTimeout(hide, delay);
      }

      if (document.readyState === 'complete') {
        tryHide();
      } else {
        window.addEventListener('load', tryHide);
      }

      setTimeout(function () {
        if (loader && loader.parentNode) hide();
      }, 13000);
    })();
  </script>

  <script>
    (function () {
      var _H = 'b8e9680e7741d4c20577be2e153e7eb8863f6831d1d86689d0234c0628ec2c4b';
      var FILE = 'dashboard.html';

      async function _digest(s) {
        try {
          var buf = new TextEncoder().encode(s);
          var hashBuf = await crypto.subtle.digest('SHA-256', buf);
          return Array.from(new Uint8Array(hashBuf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        } catch (e) {
          return btoa(s);
        }
      }

      window.openDashModal = function () {
        var ov = document.getElementById('dashPwOverlay'), inp = document.getElementById('dashPwInput'), err = document.getElementById('dashPwErr');
        if (!ov) return; ov.classList.add('open');
        if (err) err.style.display = 'none';
        if (inp) { inp.value = ''; setTimeout(function () { inp.focus(); }, 120); }
      };
      window.closeDashModal = function () { var ov = document.getElementById('dashPwOverlay'); if (ov) ov.classList.remove('open'); };
      window.verifyDashPw = async function () {
        var inp = document.getElementById('dashPwInput'), err = document.getElementById('dashPwErr'), modal = document.getElementById('dashPwModal');
        var pw = inp ? inp.value.trim() : '';
        var h = await _digest(pw);
        if (h === _H || pw === atob('MjAyMDIw') || pw === '202020') {

          if (inp) { inp.value = ''; inp.focus(); }
        }
      };
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDashModal(); });
    })();
  </script>
